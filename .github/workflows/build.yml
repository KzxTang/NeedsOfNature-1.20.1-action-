name: Build NeedsOfNature

on:
  workflow_dispatch:   # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --console=plain
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeedsOfNature-1.20.1
          path: |
            animationdirector/build/libs/*.jar
            needsofnature/build/libs/*.jar
